seed: 42
data:
  audio_root: data/raw/fma/fma_small
  metadata_csv: data/processed/task2/fma_metadata.csv
  processed_dir: data/processed/task2/graphs
  mel_dir: data/processed/task2/mels
  manifest: data/processed/task2/task2_graph_manifest.jsonl
  split_dir: data/splits/task2
  results_dir: results/task2
  sample_rate: 22050
  n_mels: 128
  segment_seconds: 5.0
  similarity_threshold: 0.75
  max_text_length: 128
model:
  text_model: distilbert-base-uncased
  text_hidden: 256
  gnn_hidden: 256
  gnn_layers: 3
  num_labels: 8
  dropout: 0.2
training:
  batch_size: 8
  cnn_batch_size: 8
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.0001
  class_weighting: balanced
  scheduler_factor: 0.5
  scheduler_patience: 5
  min_learning_rate: 0.000001
  early_stopping_patience: 12
  early_stopping_min_delta: 0.0001
  gradient_clip_norm: 1.0
  freeze_text_encoder: false
